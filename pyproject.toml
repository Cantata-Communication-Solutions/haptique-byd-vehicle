[project]
name = "haptique-byd-vehicle"
version = "0.1.0b1"
description = "Standalone BYD community driver for Haptique OS"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pybyd==0.0.77"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
